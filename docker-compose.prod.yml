services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onebite-bakery-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  uploads_data:
    driver: local
