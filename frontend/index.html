<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=4" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#596B58" />
    <meta name="application-name" content="Onebite Bakery" />
    <meta name="apple-mobile-web-app-title" content="Onebite Bakery" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Order fresh handcrafted cakes, pastries, custom celebratory cakes and party supplies online from Onebite Bakery." />
    <script>
      (function() {
        window.__PWA_PROMPT__ = null;
        window.addEventListener('beforeinstallprompt', function(event) {
          event.preventDefault();
          window.__PWA_PROMPT__ = event;
          window.dispatchEvent(new CustomEvent('pwa_prompt_available', { detail: event }));
        });
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(err) {
              console.warn('[SW] Registration error:', err);
            });
          });
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Berkshire+Swash&family=Chewy&family=Cookie&family=Dancing+Script:wght@500;600;700&family=DynaPuff:wght@600;700;800&family=Fredoka:wght@500;600;700;800&family=Great+Vibes&family=Parisienne&family=Playball&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Satisfy&family=Sniglet:wght@800&family=Titan+One&display=swap" rel="stylesheet" />
    <title>Onebite Bakery | Fresh Handcrafted Cakes, Pastries & Party Supplies</title>
  </head>
  <body class="bg-[#FFFBF5] text-[#2C1E16] antialiased selection:bg-[#E67E22]/20 selection:text-[#E67E22]">
    <div id="root">
      <style>
        .initial-loader-wrapper {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #FFFBF5;
          font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
          z-index: 9999;
        }
        .initial-loader-emblem {
          position: relative;
          width: 84px;
          height: 84px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 16px;
        }
        .initial-loader-ring {
          position: absolute;
          inset: -4px;
          border-radius: 50%;
          border: 3px solid transparent;
          border-top-color: #E67E22;
          border-right-color: #596B58;
          animation: initialSpin 1.1s linear infinite;
        }
        .initial-loader-ring-dashed {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 2px dashed rgba(230, 126, 34, 0.45);
          animation: initialSpin 9s linear infinite;
        }
        .initial-loader-disc {
          width: 62px;
          height: 62px;
          border-radius: 50%;
          background: #ffffff;
          box-shadow: 0 6px 20px rgba(230, 126, 34, 0.16);
          border: 1px solid #E5DEC9;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: initialFloat 2.4s ease-in-out infinite;
        }
        .initial-loader-title {
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #596B58;
          margin-bottom: 4px;
        }
        .initial-loader-sub {
          font-size: 15px;
          font-weight: 700;
          color: #2C1E16;
          display: flex;
          align-items: center;
          gap: 4px;
        }
        .initial-loader-dots {
          display: inline-flex;
          align-items: center;
          gap: 2px;
          margin-left: 2px;
        }
        .initial-loader-dots span {
          display: inline-block;
          width: 5px;
          height: 5px;
          border-radius: 50%;
          animation: initialBounce 1s infinite;
        }
        .initial-loader-dots span:nth-child(1) { background-color: #E67E22; animation-delay: 0s; }
        .initial-loader-dots span:nth-child(2) { background-color: #D35400; animation-delay: 0.2s; }
        .initial-loader-dots span:nth-child(3) { background-color: #596B58; animation-delay: 0.4s; }
        .initial-loader-bar {
          width: 140px;
          height: 4px;
          background: rgba(229, 222, 201, 0.6);
          border-radius: 999px;
          margin-top: 14px;
          overflow: hidden;
          position: relative;
        }
        .initial-loader-bar::after {
          content: '';
          position: absolute;
          inset: 0;
          width: 60%;
          background: linear-gradient(90deg, transparent, #E67E22, transparent);
          animation: initialShimmer 1.6s infinite ease-in-out;
        }
        @keyframes initialSpin {
          to { transform: rotate(360deg); }
        }
        @keyframes initialFloat {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-4px); }
        }
        @keyframes initialBounce {
          0%, 80%, 100% { transform: translateY(0); }
          40% { transform: translateY(-5px); }
        }
        @keyframes initialShimmer {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(200%); }
        }
      </style>
      <div class="initial-loader-wrapper">
        <div class="initial-loader-emblem">
          <div class="initial-loader-ring-dashed"></div>
          <div class="initial-loader-ring"></div>
          <div class="initial-loader-disc">
            <img src="/logo.svg" alt="Onebite Bakery" style="width: 38px; height: 38px; object-fit: contain;" />
          </div>
        </div>
        <div class="initial-loader-title">Onebite Bakery</div>
        <div class="initial-loader-sub">
          <span>Baking fresh delights</span>
          <span class="initial-loader-dots">
            <span></span><span></span><span></span>
          </span>
        </div>
        <div class="initial-loader-bar"></div>
      </div>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
