<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>You're Offline | Onebite Bakery</title>
  <meta name="theme-color" content="#596B58" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #FFF8EC;
      color: #3B302B;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E5DEC9;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(59, 48, 43, 0.06);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #FFF8EC;
      border: 2px dashed #D8BE91;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #596B58;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #3B302B;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #7A6E65;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .notice {
      background: #F7F2E7;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: #596B58;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #596B58;
      color: #FFFFFF;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      background: #465545;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're currently offline</h1>
    <p>We couldn't connect to Onebite Bakery server. Please check your internet connection to continue browsing our bakery delights or viewing your orders.</p>
    <div class="notice">
      🔒 Orders and payments require a live connection for security.
    </div>
    <button class="btn" onclick="tryReconnect()">Try Reconnecting</button>
  </div>

  <script>
    function tryReconnect() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        alert("Still offline. Please check your Wi-Fi or mobile data.");
      }
    }
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
